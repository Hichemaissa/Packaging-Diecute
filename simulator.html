<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'Ouest Packaging | 3D Simulator V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#163149;font-family:system-ui,Tahoma,sans-serif}header{background:#102e47;color:white;padding:18px 24px}header strong{font-size:22px}main{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:290px 1fr;gap:16px}.panel{background:white;border:1px solid #d7e2eb;border-radius:16px;padding:20px;box-shadow:0 6px 20px #1232}h2{margin:0 0 12px;font-size:19px}p{color:#63788b;line-height:1.7;font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}input[type=number]{width:100%;padding:12px;border:1px solid #cad8e3;border-radius:9px;direction:ltr}canvas{width:100%;height:440px;display:block;background:radial-gradient(circle at 50% 35%,#f8fcff,#dce7f2);border-radius:12px;touch-action:none;cursor:grab}button,.back{border:0;border-radius:10px;padding:12px 15px;font-weight:700;background:#0d639c;color:white;cursor:pointer;text-decoration:none;display:inline-block}button.alt{background:#e8f2f7;color:#175577}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.buttons button{flex:1}input[type=range]{width:100%;accent-color:#0d639c}.status{padding:12px;background:#f1f6fa;border-radius:10px;color:#46667b;font-size:13px}small{color:#678096}@media(max-width:780px){main{grid-template-columns:1fr;padding:12px}canvas{height:370px}}
</style></head><body><header><strong>L'Ouest Packaging</strong> — محاكي طي العلب ثلاثي الأبعاد V2 <a class="back" href="./index.html">مولّد Diecut</a></header><main><aside class="panel"><h2>أبعاد العلبة</h2><p>غيّر الأبعاد وشاهد العلبة تُعاد هندستها.</p><label>الطول L — mm</label><input id="L" type="number" value="160" min="10" max="1000"><label>العرض W — mm</label><input id="W" type="number" value="100" min="10" max="1000"><label>الارتفاع H — mm</label><input id="H" type="number" value="220" min="10" max="1200"><div class="buttons"><button id="reset">إعادة من الفردة</button><button id="assemble">▶ تشغيل الطي</button></div><p>اسحب النموذج بالإصبع لتدويره.</p><small>المحاكاة الهندسية للعرض؛ ليست قالب إنتاج معتمدًا.</small></aside><section class="panel"><h2>معاينة ثلاثية الأبعاد — Tuck End</h2><canvas id="view" aria-label="معاينة ثلاثية الأبعاد تفاعلية للعلبة"></canvas><div class="buttons"><button id="open" class="alt">فتح الغطاء</button><button id="close" class="alt">إغلاق الغطاء</button><button id="left" class="alt">↶ تدوير</button><button id="right" class="alt">↷ تدوير</button></div><label>مراحل التجميع: <span id="stageLabel">4 / 4</span></label><input id="stage" type="range" min="0" max="4" step="1" value="4"><label>التكبير</label><input id="zoom" type="range" min="60" max="160" value="100"><div class="status" id="status">علبة مجمّعة. اسحب لتدويرها.</div></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
let yaw=-.65,pitch=-.38,drag=false,lastX=0,lastY=0,stage=4,target=4,progress=4,opened=false,playing=false,clock=0,zoom=1,raf=0;
const labels=['الفردة المسطحة','طي الجوانب','تثبيت لسان اللصق','إغلاق القاعدة','إغلاق الغطاء'];
const V=(x,y,z)=>[x,y,z],add=(a,b)=>a.map((n,i)=>n+b[i]),mul=(a,s)=>a.map(n=>n*s),rotY=(a,t)=>[a[0]*Math.cos(t)+a[2]*Math.sin(t),a[1],-a[0]*Math.sin(t)+a[2]*Math.cos(t)];
function faces(){
 const L=+$('L').value,W=+$('W').value,H=+$('H').value;
 if(![L,W,H].every(v=>Number.isFinite(v)&&v>=10&&v<=1200))return [];
 const wall=Math.max(0,Math.min(1,progress)),bot=Math.max(0,Math.min(1,progress-2)),top=Math.max(0,Math.min(1,progress-3))*(opened?0:1),glue=Math.max(0,Math.min(1,progress-1));
 const theta=wall*Math.PI/2,ws=[L,W,L,W],out=[];let origin=V(-L/2,-H/2,W/2),angle=0;
 const face=(pts,color)=>out.push({pts,color});
 for(let i=0;i<4;i++){
 const w=ws[i],u=rotY(V(1,0,0),angle),normal=rotY(V(0,0,1),angle);
 const a=origin,b=add(a,mul(u,w)),c=add(b,V(0,H,0)),d=add(a,V(0,H,0));
 face([a,b,c,d],['#dfb27d','#f0cb97','#cda06c','#e9bf89'][i]);
 function flap(isTop,depth,t,major){
 const start=isTop?d:a,end=isTop?c:b,sign=isTop?1:-1,phi=t*Math.PI/2;
 const dir=add(V(0,sign*Math.cos(phi),0),mul(normal,-Math.sin(phi)));
 const p=add(start,mul(dir,depth)),q=add(end,mul(dir,depth));
 face(major?[start,end,q,p]:[start,end,add(q,mul(u,-w*.12)),add(p,mul(u,w*.12))],major?'#efc68f':'#f3d7ad');
 if(major){const lipAngle=phi+t*Math.PI/2,lipDir=add(V(0,sign*Math.cos(lipAngle),0),mul(normal,-Math.sin(lipAngle)));face([p,q,add(q,mul(lipDir,W*.2)),add(p,mul(lipDir,W*.2))],'#dfb07b');}
 }
 if(i===0){flap(false,W*.78,bot,true);const dir=rotY(V(-1,0,0),-glue*Math.PI/2);face([add(a,mul(dir,Math.min(18,W*.2))),a,d,add(d,mul(dir,Math.min(18,W*.2)))],'#bd8a56');}
 if(i===2)flap(true,W*.78,top,true);
 if(i===1||i===3){flap(true,W*.47,top,false);flap(false,W*.47,bot,false);}
 origin=b;angle+=theta;
 }
 return out;
}
function project(v){const p=rotY(v,yaw),x=p[0],z=p[2],y=p[1]*Math.cos(pitch)-z*Math.sin(pitch),depth=p[1]*Math.sin(pitch)+z*Math.cos(pitch);return [x,y,depth];}
function render(){
 const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
 if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 const polys=faces().map(f=>({color:f.color,pts:f.pts.map(project)}));
 if(!polys.length){ctx.fillStyle='#9b3232';ctx.fillText('تحقق من الأبعاد',20,30);return;}
 const points=polys.flatMap(f=>f.pts),xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 const xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
 const scale=Math.min((w-32)/Math.max(1,xmax-xmin),(h-32)/Math.max(1,ymax-ymin))*zoom;
 const cx=w/2-(xmin+xmax)*scale/2,cy=h/2-(ymin+ymax)*scale/2;
 polys.sort((a,b)=>a.pts.reduce((s,p)=>s+p[2],0)/a.pts.length-b.pts.reduce((s,p)=>s+p[2],0)/b.pts.length);
 for(const f of polys){ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(cx+p[0]*scale,cy+p[1]*scale):ctx.moveTo(cx+p[0]*scale,cy+p[1]*scale));ctx.closePath();ctx.fillStyle=f.color;ctx.strokeStyle='#916a43';ctx.lineWidth=1.25;ctx.fill();ctx.stroke();}
}
function updateLabel(){$('stageLabel').textContent=stage+' / 4';$('status').textContent=labels[stage]+(opened?' — الغطاء مفتوح':'')+' · اسحب العلبة لتدويرها';}
function setStage(n){stage=Math.max(0,Math.min(4,n));target=stage;$('stage').value=stage;updateLabel();start();}
function start(){if(!raf)raf=requestAnimationFrame(tick);}
function tick(ts){raf=0;if(playing&&ts-clock>=1250){clock=ts;if(stage<4)setStage(stage+1);else stop();}
 const diff=target-progress;if(Math.abs(diff)>.002){progress+=diff*.14;}else progress=target;
 render();if(Math.abs(diff)>.002||playing)start();}
function stop(){playing=false;$('assemble').textContent='▶ تشغيل الطي';}
$('stage').addEventListener('input',()=>{stop();opened=false;setStage(+$('stage').value)});
$('reset').onclick=()=>{stop();opened=false;setStage(0);yaw=-.65;pitch=-.38};
$('open').onclick=()=>{stop();opened=true;setStage(4)};
$('close').onclick=()=>{stop();opened=false;setStage(4)};
$('assemble').onclick=()=>{if(playing){stop();return;}opened=false;setStage(0);progress=0;playing=true;clock=performance.now();$('assemble').textContent='⏸ إيقاف';start()};
$('left').onclick=()=>{yaw-=Math.PI/6;render()};$('right').onclick=()=>{yaw+=Math.PI/6;render()};
$('zoom').oninput=()=>{zoom=+$('zoom').value/100;render()};
['L','W','H'].forEach(id=>$(id).addEventListener('input',render));
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.009;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-lastY)*.009));lastX=e.clientX;lastY=e.clientY;render()});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
window.addEventListener('resize',render);progress=4;updateLabel();render();
})();
</script></body></html>
